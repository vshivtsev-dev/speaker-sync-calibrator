# A plain container definition. Routing and TLS are left to whatever proxy you
# put in front of it — the app speaks HTTP on 8080 and reads X-Forwarded-Proto
# to decide whether its session cookie should be marked Secure.
#
# TLS in front is not optional in practice: browsers only grant microphone
# access in a secure context, so the phone needs a trusted https:// origin.

services:
  spinalign:
    build: .
    image: spinalign:latest
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Music Assistant, as reachable from this container.
      SPINALIGN_MA_URL: ${SPINALIGN_MA_URL:?set the Music Assistant URL, e.g. http://192.168.1.10:8095}
      SPINALIGN_MA_TOKEN: ${SPINALIGN_MA_TOKEN:-}

      # The reverse of the line above: how MUSIC ASSISTANT reaches *us* to
      # fetch the test track. This is not the address the browser uses. If MA
      # shares a Docker network with this service, the service name works; if
      # it runs on the host or another machine, use the host's LAN address. It
      # is required on purpose — a guess here fails halfway through a
      # calibration, with every speaker muted, rather than at startup.
      SPINALIGN_AUDIO_BASE_URL: ${SPINALIGN_AUDIO_BASE_URL:?set the address Music Assistant can reach this app on}

      # Without this, anyone who reaches the app can enumerate the speakers and
      # start a calibration — loud test tones and rewritten sync_adjust.
      SPINALIGN_ACCESS_TOKEN: ${SPINALIGN_ACCESS_TOKEN:?generate one, e.g. openssl rand -hex 24}

    volumes:
      # Saved listening positions and the probed sync_adjust sign. Without
      # this they are lost on every restart, and re-establishing the sign
      # costs two full measurement passes.
      - spinalign-state:/data

volumes:
  spinalign-state:
