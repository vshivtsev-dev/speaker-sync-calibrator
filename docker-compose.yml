# Example deployment behind Traefik. Dokploy can also set the router labels
# itself from its UI, in which case keep the environment block and drop the
# labels — the only thing that must match either way is the service port 8080.

services:
  spinalign:
    build: .
    image: spinalign:latest
    restart: unless-stopped

    environment:
      # Music Assistant, as reachable from this container.
      SPINALIGN_MA_URL: ${SPINALIGN_MA_URL:?set the Music Assistant URL, e.g. http://192.168.1.10:8095}
      SPINALIGN_MA_TOKEN: ${SPINALIGN_MA_TOKEN:-}

      # The reverse of the line above: how MUSIC ASSISTANT reaches *us* to
      # fetch the test track. This is not the address the browser uses. If MA
      # shares this Docker network, the service name works; if it runs on the
      # host or another machine, use the host's LAN address. It is required on
      # purpose — a guess here fails halfway through a calibration, with every
      # speaker muted, rather than at startup.
      SPINALIGN_AUDIO_BASE_URL: ${SPINALIGN_AUDIO_BASE_URL:?set the address Music Assistant can reach this app on}

      # Without this the public URL lets anyone enumerate the speakers and
      # start a calibration — loud test tones and rewritten sync_adjust.
      SPINALIGN_ACCESS_TOKEN: ${SPINALIGN_ACCESS_TOKEN:?generate one, e.g. openssl rand -hex 24}

    networks:
      - dokploy-network

    labels:
      - traefik.enable=true
      - traefik.http.routers.spinalign.rule=Host(`${SPINALIGN_HOSTNAME:?set the public hostname}`)
      - traefik.http.routers.spinalign.entrypoints=websecure
      - traefik.http.routers.spinalign.tls.certresolver=letsencrypt
      - traefik.http.services.spinalign.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true
