configuration:
  language:
    name: Language
    description: >-
      Language of the interface and its messages. "auto" follows each
      browser's language and falls back to English.
  ma_url:
    name: Music Assistant URL
    description: >-
      Leave empty to use the Music Assistant add-on. Set it when Music
      Assistant runs elsewhere, e.g. http://192.168.1.10:8095.
  ma_token:
    name: Music Assistant token
    description: >-
      A long-lived token created in Music Assistant, needed when its server
      requires authentication.
  audio_base_url:
    name: Address Music Assistant uses to reach Speaker Sync Calibrator
    description: >-
      Leave empty when Music Assistant is the add-on. Set it when Music
      Assistant runs elsewhere: then map port 8080 and enter
      http://<Home Assistant LAN address>:<mapped port>.
  access_token:
    name: Access token for direct access
    description: >-
      Only guards the mapped port; ingress uses your Home Assistant login.
      Leave empty and one is generated and printed in the log.
network:
  8080/tcp: Direct access, needs the access token (not needed with ingress)
